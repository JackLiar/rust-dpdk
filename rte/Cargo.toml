[dependencies]
anyhow = "1"
log = { workspace = true }
bitflags = "2"
lazy_static = { workspace = true }
libc = "0.2"
time = "0.3"
cfile = "0.5"
rand = "0.10"
errno = "0.3"
num-traits = "0.2"
num-derive = "0.5"
itertools = { workspace = true }
thiserror = "2"

rte-sys = { path = "../rte-sys", default-features = false }

[build-dependencies]
log = { workspace = true }
pretty_env_logger = { workspace = true }

[dev-dependencies]
pretty_env_logger = { workspace = true }
num_cpus = { workspace = true }
getopts = "0.2"
nix = "0.31"

[lib]
name = "rte"

[[example]]
name = "helloworld"
path = "examples/helloworld/main.rs"

