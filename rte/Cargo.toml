[package]
name = "rte"
version.workspace = true
edition.workspace = true
authors = ["Flier Lu <flier.lu@gmail.com>"]
description = "Rust bindings to DPDK 20.11"
build = "build.rs"

[features]
default = ["eal", "mbuf", "mempool", "ring", "cmdline", "ethdev"]

# 与 rte-sys 的 feature 一一对应，仅转发以控制链接。
# 顺序：libdpdk-libs.pc 的 Libs 顺序（51 个），随后是其余 librte_*.so（102 个，字母序）。

# libdpdk-libs.pc Libs 顺序（应用级库）
node = ["rte-sys/node"]
graph = ["rte-sys/graph"]
bpf = ["rte-sys/bpf"]
flow_classify = ["rte-sys/flow_classify"]
pipeline = ["rte-sys/pipeline"]
table = ["rte-sys/table"]
port = ["rte-sys/port"]
fib = ["rte-sys/fib"]
ipsec = ["rte-sys/ipsec"]
vhost = ["rte-sys/vhost"]
stack = ["rte-sys/stack"]
security = ["rte-sys/security"]
sched = ["rte-sys/sched"]
reorder = ["rte-sys/reorder"]
rib = ["rte-sys/rib"]
regexdev = ["rte-sys/regexdev"]
rawdev = ["rte-sys/rawdev"]
pdump = ["rte-sys/pdump"]
power = ["rte-sys/power"]
member = ["rte-sys/member"]
lpm = ["rte-sys/lpm"]
latencystats = ["rte-sys/latencystats"]
kni = ["rte-sys/kni"]
jobstats = ["rte-sys/jobstats"]
ip_frag = ["rte-sys/ip_frag"]
gso = ["rte-sys/gso"]
gro = ["rte-sys/gro"]
eventdev = ["rte-sys/eventdev"]
efd = ["rte-sys/efd"]
distributor = ["rte-sys/distributor"]
cryptodev = ["rte-sys/cryptodev"]
compressdev = ["rte-sys/compressdev"]
