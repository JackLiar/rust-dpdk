bbdev = ["rte-sys/bbdev"]
acl = ["rte-sys/acl"]
timer = ["rte-sys/timer"]
hash = ["rte-sys/hash"]
metrics = ["rte-sys/metrics"]
cmdline = ["rte-sys/cmdline"]
pci = ["rte-sys/pci"]
ethdev = ["rte-sys/ethdev"]
meter = ["rte-sys/meter"]
net = ["rte-sys/net"]
mbuf = ["rte-sys/mbuf"]
mempool = ["rte-sys/mempool"]
